name: xtream-strm-organizer

services:
  # Ajusta a propriedade dos arquivos de configuração e do diretório raiz da biblioteca.
  # Não percorre toda a biblioteca para evitar demora em bibliotecas grandes.
  preparar-pastas:
    image: busybox:1.36
    container_name: xtream-strm-preparar
    restart: "no"
    user: "0:0"
    volumes:
      - /DATA/AppData/XtreamStrmOrganizer/config:/app/data
      - /DATA/AppData/XtreamStrmOrganizer/Biblioteca_IPTV:/media
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      mkdir -p /app/data /media
      chown -R 1000:1000 /app/data
      chown 1000:1000 /media
      chmod 700 /app/data
      chmod 775 /media
      echo '[Xtream] Permissões das pastas principais preparadas.'

  xtream-strm:
    # Essa imagem SÓ estará disponível depois de publicar o projeto no GitHub Actions.
    image: ghcr.io/lucassfontes/xtream_strm_organizer:latest
    pull_policy: always
    container_name: xtream-strm-organizer
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      preparar-pastas:
        condition: service_completed_successfully
    ports:
      - "8686:8080"
    environment:
      TZ: Europe/Brussels
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: Production
      OUTPUT_ROOT: /media
      CONFIG_FILE: /app/data/config.json
      STRM_WRITE_WORKERS: "4"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    volumes:
      - /DATA/AppData/XtreamStrmOrganizer/config:/app/data
      - /DATA/AppData/XtreamStrmOrganizer/Biblioteca_IPTV:/media
    security_opt:
      - no-new-privileges:true

x-casaos:
  id: com.xtream.strmorganizer
  main: xtream-strm
  index: /
  port_map: "8686"
  scheme: http
  title:
    en_US: Xtream STRM Organizer
    pt_BR: Xtream STRM Organizer
  tagline:
    pt_BR: IPTV Xtream para arquivos STRM
  description:
    pt_BR: Organiza canais, filmes e séries, preservando arquivos existentes.
  author: Xtream STRM Organizer
  developer: Xtream STRM Organizer
  category: Media
  architectures:
    - amd64
  version: "1.7.3"
