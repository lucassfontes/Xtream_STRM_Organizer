services:
  preparar-pastas:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    volumes:
      - ${MEDIA_PATH:-./Biblioteca_IPTV}:/media
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      find /media -xdev -type d -user root -exec chown ${PUID:-1000}:${PGID:-1000} {} +
      find /media -xdev -type d -user ${PUID:-1000} -exec chmod u+rwx {} +
      echo '[Xtream] Pastas antigas preparadas; arquivos preservados.'
  xtream-strm:
    depends_on:
      preparar-pastas:
        condition: service_completed_successfully
    build: .
    container_name: xtream-strm
    restart: unless-stopped
    # Arquivos no host pertencem ao seu usuário Linux, nunca ao root.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8686:8080"
    environment:
      TZ: ${TZ:-Europe/Brussels}
      OUTPUT_ROOT: /media
      CONFIG_FILE: /app/data/config.json
      STRM_WRITE_WORKERS: ${STRM_WRITE_WORKERS:-4}
    volumes:
      - ./config:/app/data
      - ${MEDIA_PATH:-./Biblioteca_IPTV}:/media
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/XtreamStrmOrganizer.dll"]
      interval: 30s
      timeout: 5s
      retries: 3
