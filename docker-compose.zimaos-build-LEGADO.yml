name: xtream-strm-organizer
services:
  preparar-pastas:
    image: busybox:1.36
    container_name: xtream-strm-preparar
    restart: "no"
    user: "0:0"
    volumes:
      - /DATA/AppData/XtreamStrmOrganizer/config:/app/data
      - /DATA/AppData/XtreamStrmOrganizer/Biblioteca_IPTV:/media
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
          mkdir -p /app/data /media
          chown -R 1000:1000 /app/data
          find /media -xdev -type d -user root -exec chown 1000:1000 {} +
          find /media -xdev -type d -user 1000 -exec chmod u+rwx {} +
          chmod 700 /app/data
          chmod 775 /media
          echo '[Xtream] Permissões da biblioteca e subpastas preparadas; arquivos preservados.'

  xtream-strm:
    depends_on:
      preparar-pastas:
        condition: service_completed_successfully
    build:
      context: /DATA/AppData/XtreamStrmOrganizer/app
      dockerfile: Dockerfile
    image: xtream-strm-organizer:1.8.5
    container_name: xtream-strm-organizer
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8686:8080"
    environment:
      TZ: Europe/Brussels
      CONFIG_FILE: /app/data/config.json
      OUTPUT_ROOT: /media
      STRM_WRITE_WORKERS: "4"
    volumes:
      - /DATA/AppData/XtreamStrmOrganizer/config:/app/data
      - /DATA/AppData/XtreamStrmOrganizer/Biblioteca_IPTV:/media
