<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0a111b" />
  <link rel="icon" type="image/png" sizes="128x128" href="/icon.png?v=1.7.4" />
<title>Entrar • Xtream STRM Organizer</title>
  <style>
    :root{color-scheme:dark;--bg:#080d15;--ink:#eaf0f6;--secondary:#8f9bb0;--border:#253344;--mint:#45ddb5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 90% 12%,#173b3a55,transparent 45%),radial-gradient(ellipse at 0% 95%,#17355244,transparent 45%),var(--bg);color:var(--ink)}
    .header{height:94px;display:flex;align-items:center;padding:0 clamp(24px,6vw,72px);gap:13px}.mark{height:43px;width:43px;display:grid;place-items:center;background:linear-gradient(145deg,#1d8a78,#42d8af);border-radius:13px;color:#05291f;box-shadow:0 10px 40px #30cf9a24;font-weight:950;font-size:22px}.brand{font-size:17px;font-weight:800;letter-spacing:-.4px}.brand small{display:block;font-size:10px;font-weight:750;letter-spacing:2px;color:var(--mint);margin-top:3px}
    main{min-height:calc(100vh - 138px);display:grid;place-items:center;padding:25px 20px 60px}.card{width:min(100%,438px);background:#131d2a;border:1px solid #2d3b4b;border-radius:23px;padding:clamp(26px,5vw,41px);box-shadow:0 30px 80px #0006}.lock{display:grid;place-items:center;width:56px;height:56px;border:1px solid #2b6b60;border-radius:17px;background:#183d38;color:var(--mint);margin-bottom:25px}.eyebrow{text-transform:uppercase;letter-spacing:2.2px;font-size:10px;font-weight:800;color:var(--mint)}h1{font-size:clamp(26px,5vw,32px);margin:10px 0;letter-spacing:-1.2px}p{font-size:14px;line-height:1.65;color:var(--secondary);margin:0 0 28px}label{font-size:13px;display:block;font-weight:650;margin-bottom:9px}.field{position:relative;margin-bottom:20px}input{width:100%;height:50px;background:#0c1420;color:var(--ink);border:1px solid #324255;border-radius:11px;padding:0 14px;font:15px system-ui;outline:none}input:focus{border-color:var(--mint);box-shadow:0 0 0 3px #45ddb51b}input::placeholder{color:#657489}.pass{padding-right:55px}.eye{position:absolute;right:9px;top:34px;color:#acb9c9;border:0;background:transparent;font-size:13px;cursor:pointer;padding:10px}.btn{width:100%;background:var(--mint);color:#05291e;border:0;border-radius:12px;padding:15px;font-size:14px;font-weight:850;cursor:pointer;transition:filter .2s}.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:wait}.error{border:1px solid #853d4b;background:#43232a;color:#ffbec5;padding:12px;border-radius:10px;font-size:13px;margin:0 0 16px;display:none}.safe{display:flex;gap:9px;align-items:center;justify-content:center;border-top:1px solid var(--border);padding-top:24px;margin-top:27px;color:#90a4b1;font-size:12px}.footer{text-align:center;color:#647185;font-size:12px;padding:16px}
  </style>
</head>
<body>
  <header class="header"><span class="mark" style="background:transparent;box-shadow:none"><img src="/icon.png?v=1.7.4" alt="" width="43" height="43" /></span><span class="brand">XTREAM <small>STRM ORGANIZER</small></span></header>
  <main>
    <section class="card" aria-labelledby="heading">
      <div class="lock" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
      <div class="eyebrow">Área protegida</div><h1 id="heading">Bem-vindo de volta</h1><p>Entre para gerenciar sua conexão Xtream, organizar categorias e gerar sua biblioteca de arquivos .strm.</p>
      <div id="error" role="alert" class="error"></div>
      <form id="loginForm">
        <div class="field"><label for="username">Usuário do painel</label><input id="username" type="text" placeholder="Seu usuário" required autocomplete="username" spellcheck="false" /></div>
        <div class="field"><label for="password">Senha de acesso</label><input class="pass" id="password" type="password" required autocomplete="current-password" placeholder="Informe sua senha" /><button type="button" id="toggle" class="eye" aria-label="Mostrar senha">Mostrar</button></div>
        <button id="submit" class="btn" type="submit">Entrar no painel →</button>
      </form>
      <div class="safe"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Acesso restrito à sua biblioteca</div>
    </section>
  </main><div class="footer">Xtream STRM Organizer • C# + Docker</div>
<script>
fetch('/api/auth/setup-status').then(r=>r.json()).then(x=>{if(!x.initialized)location.replace('/setup');}).catch(()=>{});
const input=document.getElementById('password'),error=document.getElementById('error'),button=document.getElementById('submit');
document.getElementById('toggle').addEventListener('click',()=>{const open=input.type==='password';input.type=open?'text':'password';document.getElementById('toggle').textContent=open?'Ocultar':'Mostrar';});
document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();error.style.display='none';button.disabled=true;button.textContent='Validando acesso…';
 try{
  const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:input.value})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(r.status===429?'Muitas tentativas. Aguarde alguns minutos.':data.error||'Não foi possível autenticar.');
  window.location.replace('/');
 }catch(ex){error.textContent=ex.message;error.style.display='block';button.disabled=false;button.textContent='Entrar no painel →';}
});
</script>
</body>
</html>
